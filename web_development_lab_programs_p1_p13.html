        let currentProgramId = "P1";
        let currentTab = "description";

        // Initialize Application UI
        function initApp() {
            renderProgramList();
            loadProgram(currentProgramId);
        }

        // Render Sidebar Program List
        function renderProgramList() {
            const listEl = document.getElementById("program-list");
            listEl.innerHTML = "";
            
            programs.forEach(prog => {
                const btn = document.createElement("button");
                btn.className = `w-full text-left p-3.5 transition flex items-center justify-between border-l-4 ${prog.id === currentProgramId ? 'bg-slate-900 border-blue-500 text-white font-semibold' : 'border-transparent text-slate-400 hover:bg-slate-900/60 hover:text-slate-200'}`;
                btn.onclick = () => loadProgram(prog.id);
                btn.innerHTML = `
                    <div>
                        <span class="text-xs font-mono text-blue-400">${prog.id}</span>
                        <p class="text-sm truncate mt-0.5">${prog.title}</p>
                    </div>
                    <span class="text-xs text-slate-600">→</span>
                `;
                listEl.appendChild(btn);
            });
        }

        // Load Selected Program Data
        function loadProgram(id) {
            currentProgramId = id;
            const prog = programs.find(p => p.id === id);
            
            // Update Header
            document.getElementById("prog-badge").innerText = prog.id;
            document.getElementById("prog-title").innerText = prog.title;
            
            // Update Description Tab
            document.getElementById("desc-objective").innerText = prog.objective;
            document.getElementById("desc-concepts").innerText = prog.concepts;
            
            // Update Code Tab
            document.getElementById("code-filename").innerText = `${prog.id.toLowerCase()}_solution.${prog.type === 'terminal' ? 'sh' : 'html'}`;
            document.getElementById("code-content").innerText = prog.code;
            
            // Update Preview Tab
            document.getElementById("preview-container").innerHTML = prog.previewHtml;
            
            renderProgramList();
        }

        // Switch Active Tab (Description, Code, Preview)
        function switchTab(tab) {
            currentTab = tab;
            ['description', 'code', 'preview'].forEach(t => {
                const tabEl = document.getElementById(`tab-${t}`);
                const btnEl = document.getElementById(`btn-${t}`);
                if (t === tab) {
                    tabEl.classList.remove("hidden");
                    btnEl.className = "px-3.5 py-1.5 text-xs font-medium rounded-md transition bg-blue-600 text-white shadow";
                } else {
                    tabEl.classList.add("hidden");
                    btnEl.className = "px-3.5 py-1.5 text-xs font-medium rounded-md transition text-slate-300 hover:text-white";
                }
            });
        }

        // Copy Code Function
        function copyCode() {
            const prog = programs.find(p => p.id === currentProgramId);
            const textarea = document.createElement('textarea');
            textarea.value = prog.code;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            
            // Toast feedback
            const btn = document.querySelector('button[onclick="copyCode()"]');
            const originalText = btn.innerText;
            btn.innerText = "Copied!";
            btn.className = "text-xs bg-emerald-600 text-white px-3 py-1 rounded transition";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.className = "text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1 rounded transition border border-slate-700";
            }, 1500);
        }

        // Run on load
        window.onload = initApp;
    </script>
